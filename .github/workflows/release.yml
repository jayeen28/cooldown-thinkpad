name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and build
        run: make all VERSION="${GITHUB_REF_NAME#v}"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum cooldown-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" cooldown-* SHA256SUMS \
            --title "cooldown $GITHUB_REF_NAME" --generate-notes
